<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Felicitación rascable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root,
    [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;
      --color-bg: #f7f6f2;
      --color-surface: #f9f8f5;
      --color-surface-2: #fbfbf9;
      --color-surface-offset: #f3f0ec;
      --color-border: #d4d1ca;
      --color-divider: #dcd9d5;
      --color-text: #28251d;
      --color-text-muted: #6f6d67;
      --color-text-inverse: #f9f8f4;
      --color-primary: #01696f;
      --color-primary-hover: #0c4e54;
      --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
      --shadow-md: 0 10px 30px oklch(0.2 0.01 80 / 0.12);
      --radius-md: 0.75rem;
      --radius-lg: 1.25rem;
      --radius-xl: 1.75rem;
      --radius-full: 9999px;
      --font-display: 'Instrument Serif', Georgia, serif;
      --font-body: 'Work Sans', system-ui, sans-serif;
      --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --color-bg: #171614;
      --color-surface: #1c1b19;
      --color-surface-2: #201f1d;
      --color-surface-offset: #22211f;
      --color-border: #393836;
      --color-divider: #2c2b29;
      --color-text: #cdccca;
      --color-text-muted: #96948f;
      --color-text-inverse: #171614;
      --color-primary: #4f98a3;
      --color-primary-hover: #73aeb6;
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.22);
      --shadow-md: 0 10px 30px oklch(0 0 0 / 0.35);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.6;
      color: var(--color-text);
      background:
        radial-gradient(circle at top, color-mix(in oklab, var(--color-primary) 10%, transparent), transparent 38%),
        var(--color-bg);
      display: grid;
      place-items: center;
      padding: var(--space-4);
    }
    img, canvas { display: block; max-width: 100%; }
    button { font: inherit; }
    .app {
      width: min(100%, 760px);
      background: linear-gradient(180deg, var(--color-surface-2), var(--color-surface));
      border: 1px solid color-mix(in oklab, var(--color-text) 12%, transparent);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--color-divider);
      background: color-mix(in oklab, var(--color-surface) 88%, transparent);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .brand svg {
      width: 28px;
      height: 28px;
      color: var(--color-primary);
    }
    .theme-toggle {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      border: 1px solid color-mix(in oklab, var(--color-text) 14%, transparent);
      background: var(--color-surface-offset);
      color: var(--color-text);
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      transition: transform var(--transition-interactive), background var(--transition-interactive);
    }
    .theme-toggle:hover { transform: translateY(-1px); }
    .content {
      display: grid;
      gap: var(--space-8);
      padding: clamp(var(--space-5), 4vw, var(--space-10));
    }
    .intro {
      text-align: center;
      display: grid;
      gap: var(--space-3);
      justify-items: center;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0.4rem 0.9rem;
      border-radius: var(--radius-full);
      background: color-mix(in oklab, var(--color-primary) 10%, var(--color-surface-offset));
      color: var(--color-primary);
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 400;
      line-height: 1;
      max-width: 12ch;
    }
    .intro p {
      margin: 0;
      max-width: 50ch;
      color: var(--color-text-muted);
    }
    .scratch-shell {
      display: grid;
      gap: var(--space-4);
      justify-items: center;
    }
    .scratch-card {
      position: relative;
      width: min(100%, 580px);
      aspect-ratio: 4 / 5;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--color-surface-offset);
      border: 1px solid color-mix(in oklab, var(--color-text) 12%, transparent);
      box-shadow: var(--shadow-sm);
      touch-action: none;
    }
    .hidden-image,
    .scratch-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .hidden-image {
      object-fit: cover;
      background: var(--color-surface-offset);
    }
    .scratch-layer {
      cursor: crosshair;
    }
    .overlay-copy {
      position: absolute;
      inset-inline: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(90%, 28rem);
      padding: var(--space-4) var(--space-5);
      text-align: center;
      background: color-mix(in oklab, #ffffff 62%, transparent);
      color: #2f2a1f;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
      pointer-events: none;
      backdrop-filter: blur(8px);
    }
    .overlay-copy strong {
      display: block;
      font-size: var(--text-lg);
      margin-bottom: var(--space-2);
    }
    .meta {
      width: min(100%, 580px);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: var(--space-3);
      align-items: center;
    }
    .status {
      color: var(--color-text-muted);
      font-size: var(--text-sm);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
    }
    .btn {
      min-height: 44px;
      padding: 0.8rem 1.1rem;
      border-radius: var(--radius-full);
      border: 1px solid color-mix(in oklab, var(--color-text) 12%, transparent);
      background: var(--color-surface);
      color: var(--color-text);
      cursor: pointer;
      font-weight: 600;
      transition: transform var(--transition-interactive), background var(--transition-interactive), border-color var(--transition-interactive);
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: var(--color-primary);
      color: var(--color-text-inverse);
      border-color: transparent;
    }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .notes {
      display: grid;
      gap: var(--space-2);
      padding: var(--space-5);
      border-top: 1px solid var(--color-divider);
      background: color-mix(in oklab, var(--color-surface-offset) 68%, transparent);
    }
    .notes h2 {
      margin: 0;
      font-size: var(--text-lg);
      font-family: var(--font-display);
      font-weight: 400;
    }
    .notes ul {
      margin: 0;
      padding-left: 1.2rem;
      color: var(--color-text-muted);
    }
    .notes code {
      background: color-mix(in oklab, var(--color-primary) 10%, var(--color-surface));
      color: var(--color-text);
      padding: 0.15rem 0.45rem;
      border-radius: 0.45rem;
      font-size: 0.95em;
    }
    .reveal {
      animation: pulse 700ms ease;
    }
    @keyframes pulse {
      0% { transform: scale(0.98); }
      50% { transform: scale(1.01); }
      100% { transform: scale(1); }
    }
    @media (max-width: 640px) {
      .toolbar { padding: var(--space-4); }
      .meta { align-items: stretch; }
      .actions { width: 100%; }
      .actions .btn { flex: 1 1 100%; }
      .overlay-copy { padding: var(--space-3) var(--space-4); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="brand" aria-label="Felicitación rascable">
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect x="10" y="14" width="44" height="36" rx="12" stroke="currentColor" stroke-width="4"></rect>
          <path d="M20 32h24" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
          <path d="M32 20v24" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
        </svg>
        Tarjeta sorpresa
      </div>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Cambiar tema"></button>
    </header>

    <section class="content">
      <div class="intro">
        <h1>¡Felicidades Belén!</h1>
        <div class="eyebrow">Rasca para descubrir tu regalo</div>
        <p>Te queremos mucho mucho, y aunque no te hace falta nada para estar guapa... esto te podría ser útil!</p>
        

      <div class="scratch-shell">
        <div class="scratch-card" id="scratchCard">
          <img src="tarjeta.png" alt="Imagen del regalo oculto" class="hidden-image" width="580" height="725" />
          <canvas class="scratch-layer" id="scratchCanvas"></canvas>
          <div class="overlay-copy" id="overlayCopy">
            <strong>Rasca aquí</strong>
            Descubre la sorpresa moviendo el dedo o el ratón sobre la tarjeta.
          </div>
        </div>

        <div class="meta">
          <div class="status" id="statusText">Aún no se ha descubierto el regalo.</div>
          <div class="actions">
            <button class="btn" type="button" id="resetBtn">Volver a tapar</button>
            <button class="btn btn-primary" type="button" id="revealBtn">Mostrar completo</button>
          </div>
        </div>
      </div>
    </section>


  <script>
    (() => {
      const themeToggle = document.querySelector('[data-theme-toggle]');
      const root = document.documentElement;
      let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

      function renderThemeIcon() {
        themeToggle.innerHTML = theme === 'dark'
          ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
          : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
        themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro');
      }

      root.setAttribute('data-theme', theme);
      renderThemeIcon();
      themeToggle.addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', theme);
        renderThemeIcon();
      });
    })();

    (() => {
      const card = document.getElementById('scratchCard');
      const canvas = document.getElementById('scratchCanvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const resetBtn = document.getElementById('resetBtn');
      const revealBtn = document.getElementById('revealBtn');
      const statusText = document.getElementById('statusText');
      const overlayCopy = document.getElementById('overlayCopy');
      let isDrawing = false;
      let revealed = false;
      let checkTimeout = null;

      function resizeCanvas() {
        const rect = card.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.floor(rect.width * ratio);
        canvas.height = Math.floor(rect.height * ratio);
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(ratio, ratio);
        paintCover(rect.width, rect.height);
      }

      function paintCover(width, height) {
        revealed = false;
        statusText.textContent = 'Aún no se ha descubierto el regalo.';
        overlayCopy.style.display = 'block';
        card.classList.remove('reveal');

        const gradient = ctx.createLinearGradient(0, 0, width, height);
        gradient.addColorStop(0, '#d8d8d8');
        gradient.addColorStop(0.5, '#b6b6b6');
        gradient.addColorStop(1, '#ececec');

        ctx.globalCompositeOperation = 'source-over';
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < 220; i++) {
          const x = Math.random() * width;
          const y = Math.random() * height;
          const size = Math.random() * 2 + 0.4;
          ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.35})`;
          ctx.fillRect(x, y, size, size);
        }

        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.fillRect(width * 0.08, height * 0.08, width * 0.84, height * 0.16);
        ctx.globalCompositeOperation = 'destination-out';
      }

      function getPoint(event) {
        const rect = canvas.getBoundingClientRect();
        const point = event.touches ? event.touches[0] : event;
        return {
          x: point.clientX - rect.left,
          y: point.clientY - rect.top,
        };
      }

      function scratch(x, y) {
        ctx.beginPath();
        ctx.arc(x, y, 24, 0, Math.PI * 2);
        ctx.fill();
      }

      function measureReveal() {
        const { width, height } = canvas;
        const pixels = ctx.getImageData(0, 0, width, height).data;
        let transparent = 0;
        for (let i = 3; i < pixels.length; i += 4) {
          if (pixels[i] === 0) transparent++;
        }
        const percent = transparent / (width * height);
        if (percent > 0.42 && !revealed) {
          revealed = true;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          overlayCopy.style.display = 'none';
          statusText.textContent = 'Regalo descubierto. Ya puedes verlo completo.';
          card.classList.add('reveal');
        }
      }

      function queueMeasure() {
        clearTimeout(checkTimeout);
        checkTimeout = setTimeout(measureReveal, 120);
      }

      canvas.addEventListener('pointerdown', (event) => {
        isDrawing = true;
        overlayCopy.style.display = 'none';
        const point = getPoint(event);
        scratch(point.x, point.y);
        queueMeasure();
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!isDrawing || revealed) return;
        const point = getPoint(event);
        scratch(point.x, point.y);
      });

      ['pointerup', 'pointerleave', 'pointercancel'].forEach((type) => {
        canvas.addEventListener(type, () => {
          if (!isDrawing) return;
          isDrawing = false;
          queueMeasure();
        });
      });

      resetBtn.addEventListener('click', () => {
        const rect = card.getBoundingClientRect();
        paintCover(rect.width, rect.height);
      });

      revealBtn.addEventListener('click', () => {
        revealed = true;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        overlayCopy.style.display = 'none';
        statusText.textContent = 'Regalo descubierto. Ya puedes verlo completo.';
        card.classList.add('reveal');
      });

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
    })();
  </script>
</body>
</html>
